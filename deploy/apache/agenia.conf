# =============================================================================
# Agenia — hôte virtuel Apache 2.4 (exemple à adapter)
# Copier dans /etc/apache2/sites-available/agenia.conf, puis :
#   a2enmod ssl headers proxy proxy_fcgi alias setenvif
#   a2ensite agenia && apachectl configtest && systemctl reload apache2
# PHP 8.0 minimum (8.2 recommandé) via PHP-FPM.
# =============================================================================

<VirtualHost *:80>
    ServerName agenia.example.com
    Redirect permanent / https://agenia.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName agenia.example.com
    DocumentRoot /var/www/agenia

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/agenia.example.com.pem
    SSLCertificateKeyFile /etc/ssl/private/agenia.example.com.key

    <Directory /var/www/agenia>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP via PHP-FPM (adapter la version et le chemin du socket).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Protection redondante avec le .htaccess : active même si AllowOverride est désactivé.
    RedirectMatch 404 ^/(business|config|data|logs|lib|react|docs|deploy)(/|$)
    <FilesMatch "\.(avant|ancien)-|\.(bak|old|orig|save|log|jsonl|sql|sh|bat|ps1|md|conf|dll|pdb)$|^appsettings.*\.json$|^\.env|^\.git|~$">
        Require all denied
    </FilesMatch>

    # Vidéos : lecture progressive sans compression inutile.
    <IfModule mod_deflate.c>
        SetEnvIfNoCase Request_URI \.mp4$ no-gzip
    </IfModule>

    # API de paiement (.NET) : à exécuter comme service séparé, hors du site.
    # Si PHP l'appelle en HTTP, la garder en local (127.0.0.1) et ne pas l'exposer :
    # ProxyPass        /internal/business/ http://127.0.0.1:5005/
    # ProxyPassReverse /internal/business/ http://127.0.0.1:5005/

    ErrorLog  ${APACHE_LOG_DIR}/agenia_error.log
    CustomLog ${APACHE_LOG_DIR}/agenia_access.log combined
</VirtualHost>
